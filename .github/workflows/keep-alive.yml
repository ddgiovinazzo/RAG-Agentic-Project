name: Keep Render Backend Warm & Seeded

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier cold starts
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Ping Render Backend Health Endpoint
        run: |
          if [ -n "${{ secrets.BACKEND_PING_URL }}" ]; then
            echo "Pinging backend at $(date)..."
            curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ secrets.BACKEND_PING_URL }}" || true
          else
            echo "No BACKEND_PING_URL secret configured. Skipping ping."
          fi

      - name: Ping AnythingLLM RAG Service
        run: |
          if [ -n "${{ secrets.ANYTHINGLLM_PING_URL }}" ]; then
            echo "Pinging AnythingLLM at $(date)..."
            curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ secrets.ANYTHINGLLM_PING_URL }}" || true
          else
            echo "No ANYTHINGLLM_PING_URL secret configured. Skipping ping."
          fi

      - name: Ensure AnythingLLM Knowledge Base is Seeded
        env:
          ANYTHINGLLM_BASE_URL: ${{ secrets.ANYTHINGLLM_BASE_URL }}
          ANYTHINGLLM_API_KEY: ${{ secrets.ANYTHINGLLM_API_KEY }}
          ANYTHINGLLM_WORKSPACE: "apprentice-kb"
        run: |
          if [ -n "$ANYTHINGLLM_BASE_URL" ] && [ -n "$ANYTHINGLLM_API_KEY" ]; then
            echo "Checking & Seeding AnythingLLM Knowledge Base..."
            python scripts/seed_rag.py || true
          else
            echo "No ANYTHINGLLM secrets configured. Skipping auto-seeding."
          fi
