name: Keep Render Backend Warm

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier cold starts
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Pinging backend at $(date)..."
          curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://rag-agentic-backend.onrender.com/api/health || true
